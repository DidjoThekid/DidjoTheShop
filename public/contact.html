<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact · DidjoTheSHOP</title>
<script src="/logo.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body>
<header><b>DidjoTheSHOP</b><a href="/">Boutique</a><a href="/contact.html">Contact</a><a href="/#panier">Panier</a><a href="/#compte">Compte</a></header>
<main><h1>Contacter la Team DTK</h1><p class="mut">Voici la liste des membres de l'équipe disponibles pour vous répondre.</p>
<div class="card" id="box" style="padding:8px 20px"><p class="mut">Chargement…</p></div></main>
<footer><b>DidjoTheSHOP</b><br>contact@teamdtk.fr</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const box=document.getElementById('box');
(async()=>{try{
const r=await fetch('/api/employees'),d=await r.json().catch(()=>null);
if(!r.ok)throw new Error((d&&d.error)||'Erreur '+r.status);
const list=Array.isArray(d)?d:(d&&Array.isArray(d.employees)?d.employees:[]);
if(!list.length){box.innerHTML='<p class="mut">Aucun contact disponible pour le moment.</p>';return}
box.innerHTML=list.map(e=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line)"><div><b>${esc(e.name||"Membre de l'équipe")}</b><br><span class="mut" style="word-break:break-all">${esc(e.email)}</span></div><a class="btn" href="mailto:${esc(e.email)}">Envoyer un mail</a></div>`).join('');
}catch(e){box.innerHTML='<p class="err">Impossible de charger les contacts : '+esc(e.message)+'</p>'}})();
</script><script src="/fx.js"></script></body></html>
