<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact · DidjoTheSHOP</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<style>
:root{--p:#4f46e5;--line:#e5e7eb}
body{background:#f4f6fb!important}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88)!important;backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line),0 8px 24px rgba(15,23,42,.05)!important}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}
.brand img{width:38px;height:38px;border-radius:10px;object-fit:cover}
header a:hover{color:var(--p)!important}
main{max-width:800px;margin:40px auto;padding:0 20px}
h1{text-align:center;font-weight:800!important;margin-bottom:10px}
.sub{text-align:center;color:#6b7280;margin:0 0 24px}
.card{background:#fff!important;border:1px solid var(--line)!important;border-radius:18px!important;box-shadow:0 6px 20px rgba(15,23,42,.06)!important;padding:8px 20px}
.emp{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid #eee}
.emp:last-child{border-bottom:0}
.emp-name{font-weight:800;font-size:1.1rem;color:#111827}
.emp-email{color:#6b7280;font-size:.92rem;word-break:break-all}
.go{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff!important;padding:10px 18px;border-radius:999px;text-decoration:none!important;font-weight:700;font-size:.92rem;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.empty{text-align:center;color:#6b7280;padding:28px 0}
footer{margin-top:60px;padding:28px 16px 40px;text-align:center;color:#6b7280;font-size:14px;background:#fff;border-top:1px solid var(--line)}
</style></head><body>
<header><b class="brand"><img src="/logo.png" alt="">DidjoTheSHOP</b><a href="/">Boutique</a><a href="/#panier">Panier</a><a href="/contact.html">Contact</a><a href="/#compte">Compte</a></header>
<main>
<h1>Contacter la Team DTK</h1>
<p class="sub">Écris directement à un membre de l'équipe.</p>
<div class="card" id="list"><p class="empty">Chargement…</p></div>
</main>
<footer><b>DidjoTheSHOP</b><br>contact@teamdtk.fr</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async()=>{
  const box=document.getElementById('list');
  try{
    const r=await fetch('/api/employees');
    const d=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((d&&d.error)||'Erreur '+r.status);
    if(!Array.isArray(d)||!d.length){box.innerHTML='<p class="empty">Aucun contact disponible pour le moment.</p>';return}
    box.innerHTML=d.map(e=>`<div class="emp"><div><div class="emp-name">${esc(e.name)}</div><div class="emp-email">${esc(e.email)}</div></div><a class="go" href="mailto:${esc(e.email)}">Envoyer un mail</a></div>`).join('');
  }catch(e){box.innerHTML='<p class="empty" style="color:#dc2626">Impossible de charger les contacts : '+esc(e.message)+'</p>'}
})();
</script>
</body></html>
