<main>
<h1>Contacter la Team DTK</h1>
<p class="sub">Écris directement à un membre de l'équipe.</p>
<div class="card" id="list"><p class="empty">Chargement…</p></div>
</main>
<footer><b>DidjoTheSHOP</b><br>contact@teamdtk.fr</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async()=>{
  const box=document.getElementById('list');
  try{
    const r=await fetch('/api/employees');
    const d=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((d&&d.error)||'Erreur '+r.status);
    if(!Array.isArray(d)||!d.length){box.innerHTML='<p class="empty">Aucun contact disponible pour le moment.</p>';return}
    box.innerHTML=d.map(e=>`<div class="emp"><div><div class="emp-name">${esc(e.name)}</div><div class="emp-email">${esc(e.email)}</div></div><a class="go" href="mailto:${esc(e.email)}">Envoyer un mail</a></div>`).join('');
  }catch(e){box.innerHTML='<p class="empty" style="color:#dc2626">Impossible de charger les contacts : '+esc(e.message)+'</p>'}
})();
</script>
</body></html>
