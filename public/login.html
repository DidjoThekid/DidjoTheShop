<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · DidjoTheSHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body data-mode="login">
<header><b>DidjoTheSHOP</b><a href="/">Boutique</a></header>
<main><h1>Connexion</h1><p id="info" class="mut">Entre ton email et ton mot de passe. Un code de vérification te sera envoyé par mail.</p>
<form id="f" class="form"><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="email" required><label for="p">Mot de passe</label><input id="p" name="password" type="password" autocomplete="current-password" required><p><button>Se connecter</button></p><p class="mut">Pas encore de compte ? <a href="/signup">Créer un compte</a></p></form>
<form id="cf" class="form" hidden><label for="c">Code reçu par mail</label><input id="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required><p><button>Valider</button></p></form>
<p id="m"></p></main><script src="/auth.js"></script></body></html>
