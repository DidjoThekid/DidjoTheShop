<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choisir mon mot de passe · DidjoTheSHOP</title>
<script src="/logo.js"></script><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body>
<header><b>DidjoTheSHOP</b><a href="/">Boutique</a></header>
<main><h1>Choisis ton mot de passe</h1><p class="mut">Bienvenue dans la Team DTK ! Choisis un mot de passe de 8 caractères minimum.</p>
<form id="f" class="form"><label for="p1">Mot de passe</label><input id="p1" type="password" minlength="8" autocomplete="new-password" required><label for="p2">Confirme-le</label><input id="p2" type="password" minlength="8" autocomplete="new-password" required><p><button>Enregistrer</button></p></form><p id="m"></p></main>
<script>
const m=document.getElementById('m');
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
if(p1.value!==p2.value){m.className='err';m.textContent='Les deux mots de passe sont différents';return}
try{const r=await fetch('/api/set-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('t'),password:p1.value})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur');
m.className='ok';m.textContent='Mot de passe enregistré ! Redirection vers la connexion…';setTimeout(()=>location.href='/login',1500)}catch(x){m.className='err';m.textContent=x.message}};
</script><script src="/fx.js"></script></body></html>
