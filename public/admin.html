<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · DidjoTheSHOP</title><link rel="stylesheet" href="/style.css"></head><body>
<header><b>Admin DidjoTheSHOP</b><a href="/">Voir la boutique</a></header><main id="v">Chargement…</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
const api=async(p,b)=>{const r=await fetch('/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur');return j};
const ST=['En préparation','Expédié','En cours de livraison','Livré'];let D,tab='orders',img='';
async function load(){try{D=await api('admin/data')}catch(e){return $('#v').innerHTML='<h1>Accès refusé</h1><p>Connecte-toi avec le compte administrateur sur <a href="/#compte">la boutique</a>.</p>'}draw()}
const T=(k,l)=>`<button class="${tab==k?'on':'alt'}" onclick="tab='${k}';draw()">${l}</button>`;
function draw(){$('#v').innerHTML=`<div class="tabs">${T('orders','Commandes')}${T('products','Articles')}${T('users','Clients')}${T('mail','Mail')}${T('set','Livraison')}</div><p id="m"></p>`+({
orders:()=>`<table>${D.orders.map(o=>`<tr><td><b>${o.id}</b><br><span class="mut">${esc(o.email)}</span><br>${eur(o.total)}</td><td class="mut">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join('<br>')}<br>${esc(o.address)}</td><td><select id="s${o.id}">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><input id="t${o.id}" placeholder="Code de suivi" value="${esc(o.tracking)}"><button onclick="ord('${o.id}')">Enregistrer</button></td></tr>`).join('')||'<tr><td>Aucune commande.</td></tr>'}</table>`,
products:()=>`<div class="card form"><label>Nom</label><input id="pn"><label>Description</label><textarea id="pd" rows="2"></textarea><label>Prix (€)</label><input id="pp" type="number" step="0.01"><label><input id="ps" type="checkbox" style="width:auto"> Abonnement (prix par mois)</label><label>Image</label><input type="file" id="pf" accept="image/*" onchange="up(this)"><p><button onclick="prod()">Ajouter l'article</button></p></div><table>${D.products.map(p=>`<tr><td>${p.image?`<img src="${esc(p.image)}" width="56">`:''}</td><td><b>${esc(p.name)}</b><br>${eur(p.price)}${p.sub?' / mois':''}</td><td><button class="red" onclick="del('${p.id}')">Supprimer</button></td></tr>`).join('')}</table>`,
users:()=>`<table>${D.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="mut">${esc(u.email)}</span></td><td><button class="${u.banned?'alt':'red'}" onclick="ban('${u.id}',${!u.banned})">${u.banned?'Débannir':'Bannir'}</button></td></tr>`).join('')}</table>`,
mail:()=>`<div class="card form"><label>Destinataire</label><select id="mt"><option value="all">Tous les clients (${D.users.filter(u=>!u.banned).length})</option>${D.users.filter(u=>!u.banned).map(u=>`<option value="${esc(u.email)}">${esc(u.name)} · ${esc(u.email)}</option>`).join('')}</select><label>Ou une autre adresse (facultatif)</label><input id="mo" type="email" placeholder="client@exemple.fr"><label>Objet</label><input id="ms"><label>Message</label><textarea id="mm" rows="8"></textarea><p><button onclick="sendMail()">Envoyer le mail</button></p><p class="mut">Chaque destinataire reçoit son propre mail. Maximum 100 destinataires par envoi.</p></div>`,
set:()=>`<div class="form"><label>Frais de livraison (€)</label><input id="sh" type="number" step="0.01" value="${(D.shipping/100).toFixed(2)}"><p><button onclick="ship()">Enregistrer</button></p></div>`}[tab])()}
const run=async(f,msg)=>{try{await f();await load();$('#m').innerHTML=`<span class="ok">${msg}</span>`}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.ord=id=>run(()=>api('admin/order',{id,status:$('#s'+id).value,tracking:$('#t'+id).value}),'Commande mise à jour, le client est prévenu par mail');
window.prod=()=>run(async()=>{await api('admin/product',{name:$('#pn').value,desc:$('#pd').value,price:$('#pp').value,sub:$('#ps').checked,image:img});img=''},'Article ajouté');
window.del=id=>confirm('Supprimer cet article ?')&&run(()=>api('admin/product',{id,del:true}),'Article supprimé');
window.ban=(id,banned)=>run(()=>api('admin/ban',{id,banned}),banned?'Compte banni':'Compte rétabli');
window.sendMail=async()=>{if(!confirm('Envoyer ce mail ?'))return;try{const r=await api('admin/mail',{to:$('#mt').value,other:$('#mo').value,subject:$('#ms').value,message:$('#mm').value});$('#m').innerHTML=`<span class="ok">Mail envoyé (${r.sent})</span>`}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.ship=()=>run(()=>api('admin/shipping',{shipping:$('#sh').value}),'Frais enregistrés');
window.up=async el=>{const f=el.files[0];if(!f)return;const d=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});try{img=(await api('admin/upload',{name:f.name,type:f.type,data:d})).url;$('#m').innerHTML='<span class="ok">Image envoyée</span>'}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
load();
</script></body></html>
