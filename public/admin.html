<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · DidjoTheSHOP</title><link rel="stylesheet" href="/style.css">
<style>
main{max-width:none;padding:20px clamp(12px,3vw,40px) 80px}.form{max-width:none}.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}.tabs{flex-wrap:wrap}.tw{overflow-x:auto}
.tb{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--card);position:sticky;top:60px;z-index:4}
.tb button,.tb select,.tb input{width:auto;padding:6px 10px;font-size:.9rem}.tb input[type=color]{padding:2px;height:34px;width:42px}
#ed{min-height:max(260px,calc(100vh - 430px));border:1px solid var(--line);border-radius:0 0 10px 10px;padding:14px;background:#fff;color:#142033;overflow:auto;line-height:1.5}#ed a{color:#2456f5}
</style></head><body>
<header><b>Admin DidjoTheSHOP</b><a href="/">Voir la boutique</a></header><main id="v">Chargement…</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
const api=async(p,b)=>{const r=await fetch('/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur');return j};
const ST=['En préparation','Expédié','En cours de livraison','Livré'];let D,tab='orders',img='';
const TB=[['bold','<b>G</b>','Gras'],['italic','<i>I</i>','Italique'],['underline','<u>S</u>','Souligné'],['strikeThrough','<s>B</s>','Barré'],['justifyLeft','⬅','Aligner à gauche'],['justifyCenter','↔','Centrer'],['justifyRight','➡','Aligner à droite'],['insertUnorderedList','• Liste','Liste à puces'],['insertOrderedList','1. Liste','Liste numérotée'],['formatBlock:blockquote','❝ Citation','Citation'],['insertHorizontalRule','— Ligne','Ligne de séparation'],['removeFormat','✕ Effacer','Effacer la mise en forme'],['undo','↶','Annuler'],['redo','↷','Rétablir']];
async function load(){try{D=await api('admin/data')}catch(e){return $('#v').innerHTML='<h1>Accès refusé</h1><p>Connecte-toi avec le compte administrateur sur <a href="/login?next=/admin">la page de connexion</a>.</p>'}draw()}
const T=(k,l)=>`<button class="${tab==k?'on':'alt'}" onclick="tab='${k}';draw()">${l}</button>`;
const rows=(list,arch)=>`<p><input id="q" placeholder="Rechercher : code de suivi, nom du compte, email, n° de commande" oninput="flt(this.value)"></p><div class="tw"><table>${list.map(o=>`<tr data-s="${esc([o.id,o.email,o.name,o.tracking].join(' ').toLowerCase())}"><td><b>${o.id}</b><br><b>${esc(o.name)}</b><br><span class="mut">${esc(o.email)}</span><br>${eur(o.total)}<br>${o.paid?'<span class="ok">Payée</span>':'<span class="err">Non payée</span>'}</td><td class="mut">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join('<br>')}<br>${esc(o.address)}</td><td>${arch?`<b>Livrée</b>${o.tracking?`<br><span class="mut">Suivi : ${esc(o.tracking)}</span>`:''}<br><button class="red" onclick="delo('${o.id}')">Supprimer définitivement</button>`:`<select id="s${o.id}">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><input id="t${o.id}" placeholder="Code de suivi" value="${esc(o.tracking)}"><button onclick="ord('${o.id}')">Enregistrer</button>`}</td></tr>`).join('')||'<tr><td>Aucune commande.</td></tr>'}</table></div>`;
function draw(){$('#v').innerHTML=`<div class="tabs">${T('orders','Commandes')}${T('archive','Archives')}${T('products','Articles')}${T('users','Clients')}${T('mail','Mail')}${T('set','Livraison')}</div><p id="m"></p>`+({
orders:()=>rows(D.orders.filter(o=>!o.archived),false),
archive:()=>rows(D.orders.filter(o=>o.archived),true),
products:()=>`<div class="card form"><h2 style="margin-top:0">Nouvel article</h2><div class="fgrid"><div><label>Nom</label><input id="pn"></div><div><label>Prix (€)</label><input id="pp" type="number" step="0.01"></div></div><label>Description</label><textarea id="pd" rows="4"></textarea><label><input id="ps" type="checkbox" style="width:auto"> Abonnement (prix par mois)</label><label>Image</label><input type="file" id="pf" accept="image/*" onchange="up(this)"><p><img id="pv" style="max-width:200px;border-radius:10px;display:${img?'block':'none'}" src="${esc(img)}" alt=""></p><p><button onclick="prod()">Ajouter l'article</button></p></div><h2>Articles en ligne</h2><div class="tw"><table>${D.products.map(p=>`<tr><td>${p.image?`<img src="${esc(p.image)}" width="56">`:''}</td><td><b>${esc(p.name)}</b><br>${eur(p.price)}${p.sub?' / mois':''}</td><td><button class="red" onclick="del('${p.id}')">Supprimer</button></td></tr>`).join('')}</table></div>`,
users:()=>`<div class="tw"><table>${D.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="mut">${esc(u.email)}</span></td><td><button class="${u.banned?'alt':'red'}" onclick="ban('${u.id}',${!u.banned})">${u.banned?'Débannir':'Bannir'}</button></td></tr>`).join('')}</table></div>`,
mail:()=>`<div class="card form"><div class="fgrid"><div><label>Destinataire</label><select id="mt"><option value="all">Tous les clients (${D.users.filter(u=>!u.banned).length})</option>${D.users.filter(u=>!u.banned).map(u=>`<option value="${esc(u.email)}">${esc(u.name)} · ${esc(u.email)}</option>`).join('')}</select></div><div><label>Ou une autre adresse (facultatif)</label><input id="mo" type="email" placeholder="client@exemple.fr"></div></div><label>Objet</label><input id="ms"><label>Message</label>
<div class="tb"><select onchange="sz(this.value);this.value=''" title="Taille du texte"><option value="">Taille</option><option value="2">Petit</option><option value="3">Normal</option><option value="5">Grand</option><option value="6">Très grand</option><option value="h">Titre</option><option value="p">Paragraphe</option></select>${TB.map(([c,l,t])=>`<button type="button" class="alt" title="${t}" onmousedown="event.preventDefault()" onclick="fmt('${c}')">${l}</button>`).join('')}<button type="button" class="alt" onmousedown="event.preventDefault()" onclick="lnk()">🔗 Lien</button><input type="color" value="#142033" title="Couleur du texte" onchange="fmt('foreColor',this.value)"></div>
<div id="ed" contenteditable="true" spellcheck="true"></div><p><button onclick="sendMail()">Envoyer le mail</button></p><p class="mut">Chaque destinataire reçoit son propre mail. Maximum 100 destinataires par envoi. Pense à t'envoyer un essai à ta propre adresse avant un envoi à tous.</p></div>`,
set:()=>`<div class="form"><label>Frais de livraison (€)</label><input id="sh" type="number" step="0.01" value="${(D.shipping/100).toFixed(2)}"><p><button onclick="ship()">Enregistrer</button></p></div>`}[tab])()}
const run=async(f,msg)=>{try{await f();await load();$('#m').innerHTML=`<span class="ok">${msg}</span>`}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
let lastR=null;document.addEventListener('selectionchange',()=>{const s=getSelection(),ed=$('#ed');if(ed&&s.rangeCount&&ed.contains(s.anchorNode))lastR=s.getRangeAt(0).cloneRange()});
const back=()=>{const ed=$('#ed');ed.focus();if(lastR){const s=getSelection();s.removeAllRanges();s.addRange(lastR)}};
window.fmt=(c,v)=>{back();if(c.startsWith('formatBlock:'))document.execCommand('formatBlock',false,c.split(':')[1]);else document.execCommand(c,false,v)};
window.sz=v=>{if(!v)return;if(v==='h')fmt('formatBlock:h2');else if(v==='p')fmt('formatBlock:p');else fmt('fontSize',v)};
window.lnk=()=>{back();const s=getSelection(),has=s&&!s.isCollapsed,saved=lastR;const u=prompt('Adresse du lien (https://…)');if(!u)return;if(!/^(https?:\/\/|mailto:)/i.test(u))return alert('Le lien doit commencer par https:// ou mailto:');lastR=saved;if(has)fmt('createLink',u);else{const t=prompt('Texte du lien');if(t)fmt('insertHTML','<a href="'+esc(u)+'">'+esc(t)+'</a>')}};
window.flt=v=>{v=v.trim().toLowerCase();document.querySelectorAll('tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(v)?'':'none')};
window.ord=id=>run(()=>api('admin/order',{id,status:$('#s'+id).value,tracking:$('#t'+id).value}),'Commande mise à jour, le client est prévenu par mail');
window.delo=id=>confirm('Supprimer définitivement cette commande ?')&&run(()=>api('admin/order-delete',{id}),'Commande supprimée');
window.prod=()=>run(async()=>{await api('admin/product',{name:$('#pn').value,desc:$('#pd').value,price:$('#pp').value,sub:$('#ps').checked,image:img});img=''},'Article ajouté');
window.del=id=>confirm('Supprimer cet article ?')&&run(()=>api('admin/product',{id,del:true}),'Article supprimé');
window.ban=(id,banned)=>run(()=>api('admin/ban',{id,banned}),banned?'Compte banni':'Compte rétabli');
window.sendMail=async()=>{if(!confirm('Envoyer ce mail ?'))return;try{const r=await api('admin/mail-html',{to:$('#mt').value,other:$('#mo').value,subject:$('#ms').value,html:$('#ed').innerHTML});$('#m').innerHTML=`<span class="ok">Mail envoyé (${r.sent})</span>`}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.ship=()=>run(()=>api('admin/shipping',{shipping:$('#sh').value}),'Frais enregistrés');
window.up=async el=>{const f=el.files[0];if(!f)return;const d=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});try{img=(await api('admin/upload',{name:f.name,type:f.type,data:d})).url;$('#pv').src=img;$('#pv').style.display='block';$('#m').innerHTML='<span class="ok">Image envoyée</span>'}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
load();
</script></body></html>
