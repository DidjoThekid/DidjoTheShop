<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace vendeur · DidjoTheSHOP</title>
<script src="/logo.js"></script><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body>
<header><b class="brand"><img data-logo alt="">Espace vendeur</b><a href="/">Boutique</a><a href="/#compte">Compte</a></header>
<main id="v">Chargement…</main><footer><b>DidjoTheSHOP</b><br>contact@teamdtk.fr</footer>
<script>
document.querySelectorAll('img[data-logo]').forEach(i=>i.src=window.DTK_LOGO);
const $=s=>document.querySelector(s),V=h=>$('#v').innerHTML=h,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
const api=async(p,b)=>{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur');return j};
let imgs=[],eid='',S,PCT=10;
const msg=(t,c='err')=>{const m=$('#m');if(m)m.innerHTML=`<span class="${c}">${esc(t)}</span>`};
async function load(){let me=null;try{me=await api('me')}catch{}
if(!me)return V(`<h1>Vendre sur DidjoTheSHOP</h1><p>Connecte-toi ou crée un compte pour commencer.</p><p class="row"><a class="btn" href="/login?next=/seller">Se connecter</a><a class="btn alt" href="/signup">Créer un compte</a></p>`);
const s=await api('seller/me');S=s.seller;PCT=s.pct;
if(!S||S.status==='rejected')return V(`<h1>Devenir vendeur</h1>${S?`<p class="err">Ta dernière demande a été refusée : ${esc(S.reason||'sans motif')}</p>`:''}<p class="mut">Remplis cette demande. Si elle est acceptée, Stripe vérifie ta pièce d'identité, ton entreprise et ton IBAN, puis te verse tes gains automatiquement. La boutique garde ${PCT} % de commission.</p>
<div class="form"><label>Nom de ta boutique</label><input id="sh"><label>Tu vends en tant que</label><select id="ty"><option value="company">Entreprise</option><option value="individual">Particulier / auto-entrepreneur</option></select><label>Numéro SIRET (14 chiffres, ou SIREN 9 chiffres)</label><input id="si" inputmode="numeric"><label>Que vends-tu ?</label><textarea id="de" rows="3"></textarea><p><button onclick="apply()">Envoyer ma demande</button></p><p id="m"></p></div>`);
if(S.status==='pending')return V(`<h1>Demande en cours d'examen</h1><p>Ta demande pour <b>${esc(S.shop)}</b> est en cours de vérification. Tu recevras un mail dès qu'elle est traitée.</p>`);
dash()}
window.apply=async()=>{try{await api('seller/apply',{shop:$('#sh').value,type:$('#ty').value,siret:$('#si').value,desc:$('#de').value});load()}catch(e){msg(e.message)}};
async function dash(){let PR=[],OR=[];if(S.ready){[PR,OR]=await Promise.all([api('seller/products'),api('seller/orders')])}
V(`<h1>${esc(S.shop)}</h1>${S.ready?`<div class="card" style="padding:16px 18px"><p class="ok">✅ Compte vérifié : tes gains sont versés sur ton compte bancaire (commission de la boutique : ${PCT} %).</p><button class="alt" onclick="go('seller/dashboard')">Voir mes versements</button></div>`:`<div class="card" style="padding:16px 18px"><p><b>Dernière étape obligatoire</b> : vérification de ton identité, de ton entreprise et de ton IBAN par Stripe. Sans elle, tu ne peux pas vendre ni être payé.</p><button onclick="go('seller/onboard')">Commencer la vérification</button></div>`}
${S.ready?`<h2>${eid?'Modifier l\'article':'Ajouter un article'}</h2><div class="form"><label>Nom</label><input id="pn"><label>Prix (€)</label><input id="pp" type="number" step="0.01"><label>Description</label><textarea id="pd" rows="4"></textarea><label>Type</label><select id="pk"><option value="0">Réel (tu l'expédies)</option><option value="1">Virtuel (non remboursable)</option></select><label>Photos (plusieurs possibles, la 1re = couverture)</label><input type="file" id="pf" accept="image/*" multiple onchange="up(this)"><p id="pv" class="row">${imgs.map(u=>`<img src="${esc(u)}" width="72" style="border-radius:8px">`).join('')}</p><p><button onclick="save()">Enregistrer l'article</button></p><p id="m"></p></div>
<h2>Mes articles</h2><div class="tw"><table>${PR.map(p=>`<tr><td>${p.image?`<img src="${esc(p.image)}" width="56">`:''}</td><td><b>${esc(p.name)}</b><br>${eur(p.price)}<br><a href="/p/${p.id}" target="_blank">Voir la page</a></td><td><button class="alt" onclick='ed(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Modifier</button> <button class="red" onclick="del('${p.id}')">Supprimer</button></td></tr>`).join('')||'<tr><td>Aucun article.</td></tr>'}</table></div>
<h2>Mes commandes</h2><div class="tw"><table>${OR.map(o=>`<tr><td><b>${o.id}</b><br>${new Date(o.date).toLocaleDateString('fr-FR')}<br>Tu reçois ${eur(o.net)} ${o.paidOut?'<span class="ok">(versé)</span>':'<span class="mut">(en cours)</span>'}</td><td>${o.items.map(esc).join('<br>')}<br><span class="mut">${esc(o.address)}</span></td><td><input id="t${o.id}" placeholder="Code de suivi" value="${esc(o.tracking)}"><button onclick="ship('${o.id}')">Expédié</button></td></tr>`).join('')||'<tr><td>Aucune commande pour le moment.</td></tr>'}</table></div>`:''}`)}
window.go=async p=>{try{location.href=(await api(p)).url}catch(e){alert(e.message)}};
window.up=async el=>{for(const f of el.files){const d=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});try{imgs.push((await api('seller/upload',{name:f.name,type:f.type,data:d})).url)}catch(e){msg(e.message)}}$('#pv').innerHTML=imgs.map(u=>`<img src="${esc(u)}" width="72" style="border-radius:8px">`).join('')};
window.save=async()=>{try{await api('seller/product',{id:eid,name:$('#pn').value,desc:$('#pd').value,price:$('#pp').value,virtual:$('#pk').value==='1',images:imgs});imgs=[];eid='';dash()}catch(e){msg(e.message)}};
window.ed=p=>{eid=p.id;imgs=p.images||[];dash().then(()=>{$('#pn').value=p.name;$('#pp').value=p.price/100;$('#pd').value=p.desc;$('#pk').value=p.virtual?'1':'0';scrollTo({top:300,behavior:'smooth'})})};
window.del=async id=>{if(confirm('Supprimer cet article ?')){try{await api('seller/product',{id,del:true});dash()}catch(e){alert(e.message)}}};
window.ship=async id=>{try{await api('seller/order',{id,tracking:$('#t'+id).value});dash()}catch(e){alert(e.message)}};
load();
</script><script src="/fx.js"></script></body></html>
