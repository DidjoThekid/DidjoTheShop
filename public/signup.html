<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription · DidjoTheSHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body data-mode="register">
<header><b>DidjoTheSHOP</b><a href="/">Boutique</a></header>
<main><h1>Créer un compte</h1><p id="info" class="mut">Un code de vérification sera envoyé à ton adresse email.</p>
<form id="f" class="form"><label for="n">Nom</label><input id="n" name="name" autocomplete="name" required><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="email" required><label for="p">Mot de passe (8 caractères minimum)</label><input id="p" name="password" type="password" minlength="8" autocomplete="new-password" required><p><button>Créer mon compte</button></p><p class="mut">Déjà un compte ? <a href="/login">Se connecter</a></p></form>
<form id="cf" class="form" hidden><label for="c">Code reçu par mail</label><input id="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required><p><button>Valider</button></p></form>
<p id="m"></p></main><script src="/auth.js"></script></body></html>
