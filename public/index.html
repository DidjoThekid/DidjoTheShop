<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DidjoTheSHOP</title>
<script src="/logo.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head><body>
<header><b class="brand"><img data-logo alt="">DidjoTheSHOP</b><a href="/">Boutique</a><a href="/contact.html">Contact</a><a href="/seller.html">Vendre</a><a href="#plus">⭐ Plus</a><a href="#panier">Panier (<span id="n">0</span>)</a><a href="#compte">Compte</a></header><main id="v"></main>
<footer><b>DidjoTheSHOP</b><br><a href="mailto:contact@teamdtk.fr">contact@teamdtk.fr</a><br><a href="/legal.html#mentions">Mentions légales</a> · <a href="/legal.html#cgv">CGV</a> · <a href="/legal.html#retours">Retours et rétractation</a> · <a href="/legal.html#confidentialite">Confidentialité</a> · <a href="/legal.html#cookies">Cookies</a> · <a href="/legal.html#vendeurs">Conditions vendeurs</a><br><span style="font-size:13px">Paiement sécurisé par Stripe · Livraison Colissimo suivie depuis ton compte</span></footer>
<script>
const LOGO=(document.querySelector('link[rel=icon]')||{}).href||'';document.querySelectorAll('img[data-logo]').forEach(i=>i.src=LOGO);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
const api=async(p,b)=>{const r=await fetch('/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur');return j};
let D={products:[],shipping:0},me=null,cart={};try{cart=JSON.parse(localStorage.cart||'{}')}catch{}
const save=()=>{try{localStorage.cart=JSON.stringify(cart)}catch{}$('#n').textContent=Object.values(cart).reduce((a,b)=>a+b,0)};
const V=h=>$('#v').innerHTML=h,ST=['En préparation','Expédié','En cours de livraison','Livré'];
let MT=false,PL=null,DM='relay',RP='';
async function init(){try{MT=!!(await api('maintenance')).on}catch{}try{me=await api('me')}catch{}
if(me){const okp=new URLSearchParams(location.search).get('plus')==='ok';try{PL=await api('plus/status'+(okp?'?refresh=1':''))}catch{}if(okp)history.replaceState(null,'','/#plus')}
if(!(MT&&!(me&&me.admin))){try{D=await api('products')}catch{}}go()}
function maint(){V(`<section class="hero" style="flex-direction:column;text-align:center"><div><h1>🛠️ Maintenance en cours</h1><p>Une maintenance est en cours sur DidjoTheSHOP. Merci de réessayer dans quelques instants.</p><button onclick="location.reload()">Réessayer</button></div></section><p style="text-align:center"><button class="alt" onclick="location.href='/login?next=%2F'">Je suis admin</button></p>`)}
function go(){save();if(MT&&!(me&&me.admin))return maint();({'#panier':cartV,'#compte':acct,'#plus':plusV}[location.hash]||shop)()}addEventListener('hashchange',go);
function shop(){V(`<section class="hero"><div><h1>Bienvenue chez DidjoTheSHOP</h1><p>Choisis tes articles, crée un compte et commande.</p><a class="btn" href="#produits" onclick="document.getElementById('produits').scrollIntoView({behavior:'smooth'});return false">Voir les articles</a></div><img class="hero-logo" src="${LOGO}" alt=""></section><p class="mut" style="text-align:center">⭐ <a href="#plus">DidjoTheSHOP Plus</a> : livraison offerte et plus rapide en point relais, dès 9,99 € / mois.</p><h2 id="produits">Nos articles</h2><div class="grid">${D.products.map(p=>`<div class="card"><a href="/p/${p.id}" style="display:contents;color:inherit;text-decoration:none">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<div class="ph"></div>'}</a><div class="in"><a href="/p/${p.id}" style="color:inherit;text-decoration:none"><b>${esc(p.name)}</b></a><span class="mut">${esc(p.desc)}</span>${p.virtual?'<span class="mut">🎮 Article virtuel · non remboursable</span>':''}<span class="price">${eur(p.price)}${p.sub?' / mois':''}</span><button onclick="add('${p.id}')">Ajouter au panier</button></div></div>`).join('')||'<p>Aucun article pour le moment.</p>'}</div>`)}
function plusV(){
const on=!!(PL&&PL.active),d=PL&&PL.until?new Date(PL.until).toLocaleDateString('fr-FR'):'—';
V(`<section class="hero" style="flex-direction:column;text-align:center"><div><h1>⭐ DidjoTheSHOP Plus</h1><p>Plus de frais de livraison, et des commandes livrées plus vite en point relais.</p></div></section>
${on?`<div class="card sec" style="padding:18px;margin-bottom:16px"><p class="ok"><b>✅ Tu es membre Plus</b> (abonnement ${PL.interval==='year'?'annuel':'mensuel'})</p><p class="mut">${PL.cancel?'Ton abonnement se termine le ':'Prochain renouvellement le '}${d}.</p><p><button class="alt" onclick="portal()">Gérer mon abonnement</button></p></div>`:''}
<div class="grid"><div class="card"><div class="in"><b>Mensuel</b><span class="price">9,99 € / mois</span><span class="mut">Sans engagement, résiliable à tout moment.</span><button onclick="plusBuy('month')" ${on?'disabled':''}>Choisir le mensuel</button></div></div>
<div class="card"><div class="in"><b>Annuel · -17 %</b><span class="price"><s class="mut">119,88 €</s> 99,99 € / an</span><span class="mut">Tu économises 19,89 € par rapport à 12 mois au tarif mensuel.</span><button onclick="plusBuy('year')" ${on?'disabled':''}>Choisir l'annuel</button></div></div></div>
${!me?'<p class="mut"><a href="/login?next=%2F%23plus">Connecte-toi</a> ou <a href="/signup">crée un compte</a> pour t\'abonner.</p>':''}
<h2>Les avantages</h2><ul style="line-height:1.9"><li>🚚 <b>Livraison offerte</b> sur toutes tes commandes, quel que soit le montant.</li><li>⚡ <b>Livraison plus rapide</b> : tes commandes sont préparées en priorité et expédiées en <b>point relais</b>.</li><li>🏠 Tu préfères la livraison à domicile ? Elle reste offerte, avec le délai standard.</li><li>❌ Résiliable à tout moment depuis « Gérer mon abonnement ». La résiliation prend effet à la fin de la période déjà payée.</li></ul>
<p class="mut" style="font-size:13px">L'abonnement est reconduit automatiquement chaque mois ou chaque année jusqu'à résiliation. Paiement sécurisé par Stripe.</p>`)}
window.plusBuy=async iv=>{if(!me){location.href='/login?next=%2F%23plus';return}try{const r=await api('plus/subscribe',{interval:iv});location.href=r.url}catch(e){alert(e.message)}};
window.add=id=>{cart[id]=(cart[id]||0)+1;save()};window.q=(id,d)=>{if($('#rp'))RP=$('#rp').value;cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();cartV()};
window.dmode=()=>{DM=$('#dm').value;$('#rl').style.display=DM==='relay'?'block':'none';$('#hm').style.display=DM==='home'?'block':'none'};
function cartV(){const L=Object.entries(cart).map(([id,n])=>[D.products.find(p=>p.id===id),n]).filter(x=>x[0]);const s=L.reduce((a,[p,n])=>a+p.price*n,0);
const plus=!!(PL&&PL.active),hasReal=L.some(([p])=>!p.virtual),hasVirt=L.some(([p])=>p.virtual),ship=hasReal&&!plus?D.shipping:0;
const adr=`<label for="ad">Adresse de livraison</label><textarea id="ad" rows="3">${esc(me?me.address||'':'')}</textarea>`;
const deliv=!hasReal?'':plus?`<label for="dm">Mode de livraison</label><select id="dm" onchange="dmode()"><option value="relay" ${DM==='relay'?'selected':''}>⭐ Point relais : gratuit et plus rapide</option><option value="home" ${DM==='home'?'selected':''}>À domicile : gratuit, délai standard</option></select><div id="rl" style="display:${DM==='relay'?'block':'none'}"><label for="rp">Point relais choisi (nom et adresse)</label><textarea id="rp" rows="2" placeholder="Ex : Tabac Presse, 12 rue de la Paix, 91150 Étampes">${esc(RP)}</textarea><p class="mut"><a href="https://localiser.laposte.fr/" target="_blank" rel="noopener">Trouver un point relais Colissimo</a></p></div><div id="hm" style="display:${DM==='home'?'block':'none'}">${adr}</div>`:adr;
V(`<h1>Panier</h1>${L.length?`<div class="card">${L.map(([p,n])=>`<div class="row"><b style="flex:1">${esc(p.name)}${p.virtual?' <span class="mut">(virtuel)</span>':''}</b><button class="alt" onclick="q('${p.id}',-1)">−</button>${n}<button class="alt" onclick="q('${p.id}',1)">+</button><span class="price">${eur(p.price*n)}</span></div>`).join('<hr style="border:0;border-top:1px solid var(--line)">')}</div>
<p>Sous-total ${eur(s)} · Livraison ${!hasReal?'offerte (articles virtuels)':plus?'offerte ⭐ Plus':eur(ship)} · <b>Total ${eur(s+ship)}</b></p>${hasReal&&!plus?'<p class="mut">⭐ Avec <a href="#plus">DidjoTheSHOP Plus</a> : livraison offerte et plus rapide en point relais.</p>':''}${me?`<div class="form">${deliv}${hasVirt?`<p><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="av" style="margin-top:4px"><span>Je comprends que les articles virtuels ne sont <b>pas remboursables</b> et je renonce à mon droit de rétractation de 14 jours.</span></label></p>`:''}<p><button onclick="order()">Commander et payer</button></p></div>`:'<p><a href="/login?next=%2F%23panier">Connecte-toi</a> ou <a href="/signup">crée un compte</a> pour commander.</p>'}<p id="m"></p>`:'<p>Ton panier est vide.</p>'}`)}
window.order=async()=>{try{if($('#av')&&!$('#av').checked)throw new Error('Coche la case pour accepter les conditions des articles virtuels');const o=await api('order',{items:Object.entries(cart).map(([id,qty])=>({id,qty})),address:$('#ad')?$('#ad').value:'',mode:$('#dm')?$('#dm').value:'',relay:$('#rp')?$('#rp').value:'',acceptVirtual:!!($('#av')&&$('#av').checked)});cart={};save();if(o.url)location.href=o.url;else pay(o.id)}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.pay=async id=>{V(`<h1>Redirection vers le paiement…</h1><p id="m" class="mut">Paiement sécurisé par Stripe.</p>`);try{const{url}=await api('pay',{orderId:id});location.href=url}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.t2setup=async()=>{try{const r=await api('totp/setup',{});
$('#t2').innerHTML=`<p><b>1.</b> Ouvre ton application (Google Authenticator, Microsoft Authenticator, Aegis, 2FAS…) puis ajoute un compte en scannant ce QR code :</p><div id="qr" style="background:#fff;display:inline-block;padding:10px;border-radius:12px;border:1px solid var(--line)"></div><p>Ou saisis cette clé à la main :<br><b style="letter-spacing:2px;word-break:break-all">${esc(r.secret.match(/.{1,4}/g).join(' '))}</b></p><p><a href="${esc(r.uri)}">Ouvrir dans mon application (sur téléphone)</a></p><p><b>2.</b> Entre le code à 6 chiffres affiché dans l'application :</p><p class="row"><input id="t2c" inputmode="numeric" maxlength="7" placeholder="123456" autocomplete="one-time-code"><button onclick="t2on()">Confirmer</button></p>`;
if(window.QRCode)new QRCode($('#qr'),{text:r.uri,width:180,height:180})}catch(e){$('#t2m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.t2on=async()=>{try{await api('totp/enable',{code:$('#t2c').value});me=await api('me');acct()}catch(e){$('#t2m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.t2off=async()=>{try{await api('totp/disable',{code:$('#t2c').value});me=await api('me');acct()}catch(e){$('#t2m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
const plusBox=()=>`<div class="card sec" style="padding:18px;margin-bottom:12px"><p><b>⭐ DidjoTheSHOP Plus</b></p>${PL&&PL.active?`<p class="ok">Abonnement ${PL.interval==='year'?'annuel':'mensuel'} actif. ${PL.cancel?'Fin le ':'Renouvellement le '}${PL.until?new Date(PL.until).toLocaleDateString('fr-FR'):'—'}.</p><p><button class="alt" onclick="portal()">Gérer mon abonnement</button></p>`:`<p class="mut">Livraison offerte et plus rapide en point relais : 9,99 € / mois ou 99,99 € / an.</p><p><a class="btn" href="#plus">Découvrir Plus</a></p>`}</div>`;
async function acct(){if(!me){location.href='/login';return}
let O=[],C=[];try{[O,C]=await Promise.all([api('orders'),api('cards')])}catch{}
await Promise.all(O.filter(o=>!o.paid&&o.sessionId).map(async o=>{try{o.paid=(await api('pay/confirm',{orderId:o.id})).paid}catch{}}));
V(`<h1>Bonjour ${esc(me.name)}</h1><p class="row">${me.admin||me.employee?'<a class="btn" href="/admin">Panel admin</a>':''}<button class="alt" onclick="portal()">Portail client Stripe</button><button class="alt" onclick="out()">Se déconnecter</button></p>
${plusBox()}${infoV()}<h2>Sécurité</h2><div class="card sec">${me.totp?`<p class="ok">✅ Application d'authentification activée</p><p class="mut">À chaque connexion, tu entres le code à 6 chiffres de ton application (plus besoin d'attendre un mail).</p><div id="t2"><p>Pour la désactiver, entre un code actuel :</p><p class="row"><input id="t2c" inputmode="numeric" maxlength="7" placeholder="123456" autocomplete="one-time-code"><button class="alt" onclick="t2off()">Désactiver</button></p></div>`:`<p><b>Connexion avec une application d'authentification</b></p><p class="mut">Sécurise ton compte : tu te connectes avec un code à 6 chiffres généré par ton téléphone.</p><div id="t2"><button onclick="t2setup()">Activer l'application d'authentification</button></div>`}<p id="t2m"></p></div>
<h2>Moyens de paiement</h2><p><button onclick="portal('payment_method')">➕ Ajouter un moyen de paiement</button></p>${C.map(c=>`<div class="card" style="margin-bottom:8px;padding:12px 16px">${esc(c.brand||'Carte')} •••• ${esc(c.last4||'')}</div>`).join('')||'<p class="mut">Aucune carte enregistrée. Tu pourras en enregistrer une au moment du paiement.</p>'}
<h2>Mes commandes</h2>${O.map(o=>`<div class="card" style="margin-bottom:12px;padding:16px 18px"><b>${o.id}</b> · ${new Date(o.date).toLocaleDateString('fr-FR')} · ${eur(o.total)} · ${o.paid?'<span class="ok">Payée</span>':`<button onclick="pay('${o.id}')">Payer</button>`}<div class="steps">${ST.map((s,i)=>`<i class="${i<=ST.indexOf(o.status)?'on':''}"></i>`).join('')}</div><b>${esc(o.status)}</b>${o.tracking?`<div class="mut">Code de suivi : ${esc(o.tracking)}</div>`:''}<div class="mut">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div></div>`).join('')||'<p>Aucune commande pour le moment.</p>'}`)}
let EMs=false;
function infoV(){
const sec=(t,b)=>`<div class="card sec" style="padding:18px;margin-bottom:12px"><p><b>${t}</b></p>${b}</div>`;
const em=me.admin?'<p class="mut">L\'adresse du compte administrateur ne peut pas être changée ici.</p>'
:EMs?`<p class="mut">Un code a été envoyé à ta nouvelle adresse.</p><p class="row"><input id="em-c" inputmode="numeric" maxlength="7" placeholder="123456" autocomplete="one-time-code"><button onclick="emConfirm()">Confirmer</button></p>`
:`<p class="mut">Actuelle : ${esc(me.email)}</p><div class="form"><label for="em-e">Nouvelle adresse e-mail</label><input id="em-e" type="email"><label for="em-p">Mot de passe actuel</label><input id="em-p" type="password" autocomplete="current-password"><p><button onclick="emChange()">Recevoir un code</button></p></div>`;
const pw=me.admin?'<p class="mut">Le mot de passe admin se change dans les variables Vercel (ADMIN_PASSWORD).</p>'
:`<div class="form"><label for="pw-c">Mot de passe actuel</label><input id="pw-c" type="password" autocomplete="current-password"><label for="pw-n">Nouveau mot de passe (8 caractères minimum)</label><input id="pw-n" type="password" autocomplete="new-password"><p><button onclick="pwChange()">Changer le mot de passe</button></p></div>`;
const mailPref=`<div class="form"><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="unsub" ${!me.unsubscribed?'checked':''} onchange="toggleUnsub(this.checked)" style="margin-top:4px;width:auto"><span>Recevoir les e-mails de la boutique (actualités, promotions).<br><span class="mut" style="font-size:0.9em">Décochez cette case pour vous désabonner.</span></span></label></div>`;
return `<h2>Mes informations</h2><p id="im"></p>`+sec('Profil',`<div class="form"><label for="in-n">Nom</label><input id="in-n" value="${esc(me.name)}" maxlength="60"><label for="in-a">Adresse de livraison par défaut</label><textarea id="in-a" rows="3">${esc(me.address||'')}</textarea><p><button onclick="saveProfile()">Enregistrer mes informations</button></p></div>`)+sec('Adresse e-mail',em)+sec('Mot de passe',pw)+sec('Préférences e-mail',mailPref);
}
const done=async m=>{me=await api('me');await acct();const e=$('#im');if(e)e.innerHTML=`<span class="ok">${esc(m)}</span>`};
const fail=e=>{const x=$('#im');if(x)x.innerHTML=`<span class="err">${esc(e.message)}</span>`};
window.saveProfile=async()=>{try{await api('profile',{name:$('#in-n').value,address:$('#in-a').value});await done('Informations enregistrées')}catch(e){fail(e)}};
window.pwChange=async()=>{try{await api('password',{current:$('#pw-c').value,next:$('#pw-n').value});await done('Mot de passe modifié')}catch(e){fail(e)}};
window.emChange=async()=>{try{await api('email/change',{email:$('#em-e').value,password:$('#em-p').value});EMs=true;await done('Code envoyé à ta nouvelle adresse')}catch(e){fail(e)}};
window.emConfirm=async()=>{try{await api('email/confirm',{code:$('#em-c').value});EMs=false;await done('Adresse e-mail modifiée')}catch(e){fail(e)}};
window.toggleUnsub=async(checked)=>{
  try{
    await api('profile',{unsubscribed:!checked});
    me=await api('me');
    await acct();
    const e=$('#im');if(e)e.innerHTML=`<span class="ok">${checked?'Vous êtes réabonné aux e-mails.':'Vous êtes désabonné des e-mails promotionnels.'}</span>`;
  }catch(e){const x=$('#im');if(x)x.innerHTML=`<span class="err">${esc(e.message)}</span>`}
};
window.out=async()=>{await api('logout',{});me=null;location.href='/login'};
window.portal=async flow=>{try{const r=await api('portal',{flow:flow||''});location.href=r.url}catch(e){alert(e.message)}};
init();
</script>
<script src="/fx.js"></script>
</body></html>
