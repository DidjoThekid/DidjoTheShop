<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DidjoTheSHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body>
<header><b>DidjoTheSHOP</b><a href="#">Boutique</a><a href="#panier">Panier (<span id="n">0</span>)</a><a href="#compte">Compte</a></header><main id="v"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
const api=async(p,b)=>{const r=await fetch('/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur');return j};
let D={products:[],shipping:0},me=null,cart={};try{cart=JSON.parse(localStorage.cart||'{}')}catch{}
const save=()=>{try{localStorage.cart=JSON.stringify(cart)}catch{}$('#n').textContent=Object.values(cart).reduce((a,b)=>a+b,0)};
const V=h=>$('#v').innerHTML=h,ST=['En préparation','Expédié','En cours de livraison','Livré'];
const sdk=()=>window.SumUpCard?Promise.resolve():new Promise((r,j)=>{const s=document.createElement('script');s.src='https://gateway.sumup.com/gateway/ecom/card/v2/sdk.js';s.onload=r;s.onerror=()=>j(new Error('Impossible de charger le paiement SumUp'));document.head.appendChild(s)});
async function init(){try{D=await api('products');me=await api('me')}catch{}go()}
function go(){save();({'#panier':cartV,'#compte':acct}[location.hash]||shop)()}addEventListener('hashchange',go);
function shop(){V(`<h1>La boutique</h1><p class="mut">Choisis tes articles, crée un compte et commande.</p><div class="grid">${D.products.map(p=>`<div class="card">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<div class="ph"></div>'}<div class="in"><b>${esc(p.name)}</b><span class="mut">${esc(p.desc)}</span><span class="price">${eur(p.price)}${p.sub?' / mois':''}</span><button onclick="add('${p.id}')">Ajouter au panier</button></div></div>`).join('')||'<p>Aucun article pour le moment.</p>'}</div>`)}
window.add=id=>{cart[id]=(cart[id]||0)+1;save()};window.q=(id,d)=>{cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();cartV()};
function cartV(){const L=Object.entries(cart).map(([id,n])=>[D.products.find(p=>p.id===id),n]).filter(x=>x[0]);const s=L.reduce((a,[p,n])=>a+p.price*n,0);
V(`<h1>Panier</h1>${L.length?`<div class="card">${L.map(([p,n])=>`<div class="row"><b style="flex:1">${esc(p.name)}</b><button class="alt" onclick="q('${p.id}',-1)">−</button>${n}<button class="alt" onclick="q('${p.id}',1)">+</button><span class="price">${eur(p.price*n)}</span></div>`).join('<hr style="border:0;border-top:1px solid var(--line)">')}</div>
<p>Sous-total ${eur(s)} · Livraison ${eur(D.shipping)} · <b>Total ${eur(s+D.shipping)}</b></p>${me?`<div class="form"><label for="ad">Adresse de livraison</label><textarea id="ad" rows="3"></textarea><p><button onclick="order()">Commander et payer</button></p></div>`:'<p><a href="/login?next=%2F%23panier">Connecte-toi</a> ou <a href="/signup">crée un compte</a> pour commander.</p>'}<p id="m"></p>`:'<p>Ton panier est vide.</p>'}`)}
window.order=async()=>{try{const o=await api('order',{items:Object.entries(cart).map(([id,qty])=>({id,qty})),address:$('#ad').value});cart={};save();pay(o.id)}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.pay=async id=>{V(`<h1>Paiement</h1><p class="mut">Paiement sécurisé par SumUp. Ton numéro de carte ne passe jamais par ce site.</p><div id="sumup-card"></div><p id="m"></p>`);
try{const{checkoutId}=await api('pay',{orderId:id});await sdk();SumUpCard.mount({id:'sumup-card',checkoutId,locale:'fr-FR',onResponse:async t=>{if(t==='success'){try{const r=await api('pay/confirm',{orderId:id});V(r.paid?`<h1>Paiement reçu</h1><p>Merci ! Suis ta commande dans <a href="#compte">ton compte</a>.</p>`:`<h1>Paiement en cours de vérification</h1><p>Actualise <a href="#compte">ton compte</a> dans un instant.</p>`)}catch(e){$('#m').textContent=e.message}}else if(t==='error'||t==='fail')$('#m').innerHTML='<span class="err">Le paiement a échoué. Vérifie ta carte et réessaie.</span>'}})}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.addCard=async()=>{V(`<h1>Ajouter une carte</h1><p class="mut">Coche l'option pour enregistrer la carte. Une vérification de 0,01 € est faite, puis remboursée tout de suite.</p><div id="sumup-card"></div><p id="m"></p>`);
try{const{checkoutId}=await api('card/setup',{});await sdk();SumUpCard.mount({id:'sumup-card',checkoutId,locale:'fr-FR',onResponse:t=>{if(t==='success')acct();else if(t==='error'||t==='fail')$('#m').innerHTML='<span class="err">La carte n\'a pas pu être vérifiée.</span>'}})}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
async function acct(){if(!me){location.href='/login';return}
let O=[],C=[];try{[O,C]=await Promise.all([api('orders'),api('cards')])}catch{}
await Promise.all(O.filter(o=>!o.paid&&o.checkoutId).map(async o=>{try{o.paid=(await api('pay/confirm',{orderId:o.id})).paid}catch{}}));
V(`<h1>Bonjour ${esc(me.name)}</h1><p class="row">${me.admin?'<a class="btn" href="/admin">Panel admin</a>':''}<button class="alt" onclick="out()">Se déconnecter</button></p>
<h2>Moyens de paiement</h2>${C.map(c=>`<div class="card" style="margin-bottom:8px">${esc(c.brand||'Carte')} •••• ${esc(c.last4||'')}</div>`).join('')||'<p class="mut">Aucune carte enregistrée.</p>'}<p><button class="alt" onclick="addCard()">Ajouter une carte</button></p>
<h2>Mes commandes</h2>${O.map(o=>`<div class="card" style="margin-bottom:12px"><b>${o.id}</b> · ${new Date(o.date).toLocaleDateString('fr-FR')} · ${eur(o.total)} · ${o.paid?'<span class="ok">Payée</span>':`<button onclick="pay('${o.id}')">Payer</button>`}<div class="steps">${ST.map((s,i)=>`<i class="${i<=ST.indexOf(o.status)?'on':''}"></i>`).join('')}</div><b>${esc(o.status)}</b>${o.tracking?`<div class="mut">Code de suivi : ${esc(o.tracking)}</div>`:''}<div class="mut">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div></div>`).join('')||'<p>Aucune commande pour le moment.</p>'}`)}
window.out=async()=>{await api('logout',{});me=null;location.href='/login'};init();
</script></body></html>
