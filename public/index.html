<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DidjoTheSHOP</title>
<!-- COLLE ICI TA LIGNE <link rel="icon" type="image/png" href="data:image/png;base64,..."> COPIÉE DE L'ANCIEN index.html -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{--p:#4f46e5;--line:#e5e7eb}
html{scroll-behavior:smooth}
body{background:#f4f6fb!important}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88)!important;backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line),0 8px 24px rgba(15,23,42,.05)!important}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}
.brand img{width:38px;height:38px;border-radius:10px;object-fit:cover}
header a{transition:color .15s}header a:hover{color:var(--p)!important}
h1{font-weight:800!important;letter-spacing:-.6px}
h2{font-weight:800!important;letter-spacing:-.3px}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:24px;margin:8px 0 36px;padding:34px;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#06b6d4);color:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(79,70,229,.28);animation:pageIn .5s ease both}
.hero::after{content:'';position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{color:#fff!important;font-size:clamp(24px,3.8vw,38px)!important;margin:0 0 10px}
.hero p{color:#e0e7ff;margin:0 0 20px;font-size:17px}
.hero-logo{position:relative;z-index:1;width:120px;height:120px;border-radius:26px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:introFloat 3s ease-in-out infinite alternate;flex:none}
.hero a.btn{background:#fff!important;color:#4338ca!important;box-shadow:0 8px 20px rgba(0,0,0,.2)!important}
.card{overflow:hidden;background:#fff!important;border:1px solid var(--line)!important;border-radius:18px!important;box-shadow:0 6px 20px rgba(15,23,42,.06)!important;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(79,70,229,.18)!important}
.grid .card{animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both}
.grid .card:nth-child(2){animation-delay:.08s}.grid .card:nth-child(3){animation-delay:.16s}.grid .card:nth-child(4){animation-delay:.24s}.grid .card:nth-child(5){animation-delay:.32s}.grid .card:nth-child(6){animation-delay:.4s}
.grid .card>img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;transition:transform .4s}
.grid .card:hover>img{transform:scale(1.06)}
.in b{font-size:18px}
.price{align-self:flex-start;font-weight:800!important;color:var(--p)!important;background:#eef2ff;padding:4px 12px;border-radius:999px}
button,.btn,a.btn{font-family:inherit!important;font-weight:700!important;font-size:15px!important;color:#fff!important;background:linear-gradient(135deg,#4f46e5,#6366f1)!important;border:0!important;border-radius:999px!important;padding:11px 20px!important;cursor:pointer;box-shadow:0 6px 16px rgba(79,70,229,.3)!important;text-decoration:none!important;text-shadow:none!important;transition:transform .15s,filter .15s}
button:hover,.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
button:active,.btn:active{transform:scale(.97)}
button.alt{background:#fff!important;color:#374151!important;border:1px solid #d1d5db!important;box-shadow:none!important}
.in button{width:100%}
textarea,input,select{border:1px solid #d1d5db!important;border-radius:12px!important;padding:12px!important;font:inherit;background:#fff}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--p)!important;box-shadow:0 0 0 4px rgba(79,70,229,.15)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.steps{display:flex;gap:6px;margin:12px 0}
.steps i{flex:1;height:8px;border-radius:99px!important;background:#e5e7eb!important;border:0!important}
.steps i.on{background:linear-gradient(90deg,#4f46e5,#06b6d4)!important}
#v>*{animation:pageIn .4s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes introFloat{from{transform:translateY(0)}to{transform:translateY(-10px)}}
footer{margin-top:60px;padding:28px 16px 40px;text-align:center;color:#6b7280;font-size:14px;background:#fff;border-top:1px solid var(--line)}
footer b{color:#111827;font-size:16px}
.sec{padding:18px;margin-bottom:12px}
.sec .okk{color:#16a34a;font-weight:700}
@media (prefers-reduced-motion:reduce){.grid .card,#v>*{animation:none}}
@media (max-width:640px){header{flex-wrap:wrap;gap:12px!important;padding:10px 14px!important}.hero{flex-direction:column;text-align:center;padding:24px}.hero-logo{width:96px;height:96px}}
</style></head><body>
<header><b class="brand"><img data-logo alt="">DidjoTheSHOP</b><a href="#">Boutique</a><a href="#panier">Panier (<span id="n">0</span>)</a><a href="#compte">Compte</a></header><main id="v"></main>
<footer><b>DidjoTheSHOP</b><br>Paiement sécurisé par Stripe · Livraison suivie depuis ton compte</footer>
<script>
const LOGO=(document.querySelector('link[rel=icon]')||{}).href||'';document.querySelectorAll('img[data-logo]').forEach(i=>i.src=LOGO);
/* ===== Boutique ===== */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
const api=async(p,b)=>{const r=await fetch('/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur');return j};
let D={products:[],shipping:0},me=null,cart={};try{cart=JSON.parse(localStorage.cart||'{}')}catch{}
const save=()=>{try{localStorage.cart=JSON.stringify(cart)}catch{}$('#n').textContent=Object.values(cart).reduce((a,b)=>a+b,0)};
const V=h=>$('#v').innerHTML=h,ST=['En préparation','Expédié','En cours de livraison','Livré'];
async function init(){try{D=await api('products');me=await api('me')}catch{}go()}
function go(){save();({'#panier':cartV,'#compte':acct}[location.hash]||shop)()}addEventListener('hashchange',go);
function shop(){V(`<section class="hero"><div><h1>Bienvenue chez DidjoTheSHOP</h1><p>Choisis tes articles, crée un compte et commande.</p><a class="btn" href="#produits" onclick="document.getElementById('produits').scrollIntoView({behavior:'smooth'});return false">Voir les articles</a></div><img class="hero-logo" src="${LOGO}" alt=""></section><h2 id="produits">Nos articles</h2><div class="grid">${D.products.map(p=>`<div class="card">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<div class="ph"></div>'}<div class="in"><b>${esc(p.name)}</b><span class="mut">${esc(p.desc)}</span><span class="price">${eur(p.price)}${p.sub?' / mois':''}</span><button onclick="add('${p.id}')">Ajouter au panier</button></div></div>`).join('')||'<p>Aucun article pour le moment.</p>'}</div>`)}
window.add=id=>{cart[id]=(cart[id]||0)+1;save()};window.q=(id,d)=>{cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();cartV()};
function cartV(){const L=Object.entries(cart).map(([id,n])=>[D.products.find(p=>p.id===id),n]).filter(x=>x[0]);const s=L.reduce((a,[p,n])=>a+p.price*n,0);
V(`<h1>Panier</h1>${L.length?`<div class="card">${L.map(([p,n])=>`<div class="row"><b style="flex:1">${esc(p.name)}</b><button class="alt" onclick="q('${p.id}',-1)">−</button>${n}<button class="alt" onclick="q('${p.id}',1)">+</button><span class="price">${eur(p.price*n)}</span></div>`).join('<hr style="border:0;border-top:1px solid var(--line)">')}</div>
<p>Sous-total ${eur(s)} · Livraison ${eur(D.shipping)} · <b>Total ${eur(s+D.shipping)}</b></p>${me?`<div class="form"><label for="ad">Adresse de livraison</label><textarea id="ad" rows="3"></textarea><p><button onclick="order()">Commander et payer</button></p></div>`:'<p><a href="/login?next=%2F%23panier">Connecte-toi</a> ou <a href="/signup">crée un compte</a> pour commander.</p>'}<p id="m"></p>`:'<p>Ton panier est vide.</p>'}`)}
window.order=async()=>{try{const o=await api('order',{items:Object.entries(cart).map(([id,qty])=>({id,qty})),address:$('#ad').value});cart={};save();if(o.url)location.href=o.url;else pay(o.id)}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.pay=async id=>{V(`<h1>Redirection vers le paiement…</h1><p id="m" class="mut">Paiement sécurisé par Stripe.</p>`);try{const{url}=await api('pay',{orderId:id});location.href=url}catch(e){$('#m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
/* ===== Application d'authentification ===== */
window.t2setup=async()=>{try{const r=await api('totp/setup',{});
$('#t2').innerHTML=`<p><b>1.</b> Ouvre ton application (Google Authenticator, Microsoft Authenticator, Aegis, 2FAS…) puis ajoute un compte en scannant ce QR code :</p><div id="qr" style="background:#fff;display:inline-block;padding:10px;border-radius:12px;border:1px solid var(--line)"></div><p>Ou saisis cette clé à la main :<br><b style="letter-spacing:2px;word-break:break-all">${esc(r.secret.match(/.{1,4}/g).join(' '))}</b></p><p><a href="${esc(r.uri)}">Ouvrir dans mon application (sur téléphone)</a></p><p><b>2.</b> Entre le code à 6 chiffres affiché dans l'application :</p><p class="row"><input id="t2c" inputmode="numeric" maxlength="7" placeholder="123456" autocomplete="one-time-code"><button onclick="t2on()">Confirmer</button></p>`;
if(window.QRCode)new QRCode($('#qr'),{text:r.uri,width:180,height:180})}catch(e){$('#t2m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.t2on=async()=>{try{await api('totp/enable',{code:$('#t2c').value});me=await api('me');acct()}catch(e){$('#t2m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
window.t2off=async()=>{try{await api('totp/disable',{code:$('#t2c').value});me=await api('me');acct()}catch(e){$('#t2m').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
/* ===== Compte ===== */
async function acct(){if(!me){location.href='/login';return}
let O=[],C=[];try{[O,C]=await Promise.all([api('orders'),api('cards')])}catch{}
await Promise.all(O.filter(o=>!o.paid&&o.sessionId).map(async o=>{try{o.paid=(await api('pay/confirm',{orderId:o.id})).paid}catch{}}));
V(`<h1>Bonjour ${esc(me.name)}</h1><p class="row">${me.admin?'<a class="btn" href="/admin">Panel admin</a>':''}<button class="alt" onclick="out()">Se déconnecter</button></p>
<h2>Sécurité</h2><div class="card sec">${me.totp?`<p class="okk">✅ Application d'authentification activée</p><p class="mut">À chaque connexion, tu entres le code à 6 chiffres de ton application (plus besoin d'attendre un mail).</p><div id="t2"><p>Pour la désactiver, entre un code actuel :</p><p class="row"><input id="t2c" inputmode="numeric" maxlength="7" placeholder="123456" autocomplete="one-time-code"><button class="alt" onclick="t2off()">Désactiver</button></p></div>`:`<p><b>Connexion avec une application d'authentification</b></p><p class="mut">Sécurise ton compte : tu te connectes avec un code à 6 chiffres généré par ton téléphone.</p><div id="t2"><button onclick="t2setup()">Activer l'application d'authentification</button></div>`}<p id="t2m"></p></div>
<h2>Moyens de paiement</h2>${C.map(c=>`<div class="card" style="margin-bottom:8px">${esc(c.brand||'Carte')} •••• ${esc(c.last4||'')}</div>`).join('')||'<p class="mut">Aucune carte enregistrée. Tu pourras en enregistrer une au moment du paiement.</p>'}
<h2>Mes commandes</h2>${O.map(o=>`<div class="card" style="margin-bottom:12px"><b>${o.id}</b> · ${new Date(o.date).toLocaleDateString('fr-FR')} · ${eur(o.total)} · ${o.paid?'<span class="ok">Payée</span>':`<button onclick="pay('${o.id}')">Payer</button>`}<div class="steps">${ST.map((s,i)=>`<i class="${i<=ST.indexOf(o.status)?'on':''}"></i>`).join('')}</div><b>${esc(o.status)}</b>${o.tracking?`<div class="mut">Code de suivi : ${esc(o.tracking)}</div>`:''}<div class="mut">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div></div>`).join('')||'<p>Aucune commande pour le moment.</p>'}`)}
window.out=async()=>{await api('logout',{});me=null;location.href='/login'};init();
</script>
</body></html>
